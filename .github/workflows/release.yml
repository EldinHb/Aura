# Builds installers for macOS, Windows and Linux and publishes them as a GitHub
# release. Triggered by pushing a tag that matches the app version:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The release is created as a draft, every platform uploads into it, and it is
# published only once all builds succeed, so a half-filled release is never
# visible.
#
# The Android app is built by its own job and attached to the same release as
# Aura-<version>-android.apk. It is signed with the release keystore in the
# AURA_ANDROID_* secrets; without them the build falls back to the debug key,
# and the APK is then debug-signed: it installs, but cannot update (or be
# updated by) an APK signed with the release key.
#
# Updates: every installer is signed for tauri-plugin-updater with the key in
# the TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets
# (the public key is in tauri.conf.json). The publish job assembles latest.json
# from the signatures and uploads it with the release, so installed copies find
# the new version at /releases/latest/download/latest.json once it is published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      # Installer file names come from the version in tauri.conf.json, so a tag
      # that disagrees with it would ship mislabeled files.
      - name: Check tag matches app version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      # The Android APK's file name and version come from versionName.
      - name: Check tag matches Android version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' apps/android/app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Android versionName '$version' in apps/android/app/build.gradle.kts"
            exit 1
          fi

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        # The id comes from the create response itself: listing releases right
        # after creating one can miss the new draft, and an empty id makes the
        # build jobs skip uploading without failing.
        # Hand-written notes in docs/releases/<version>.md go first; GitHub
        # puts the notes it generates from the commits after them.
        run: |
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          body=()
          if [ -f "$notes" ]; then body=(-F "body=@$notes"); fi
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Aura $GITHUB_REF_NAME" \
            "${body[@]}" -F draft=true -F generate_release_notes=true --jq .id)
          if [ -z "$id" ]; then
            echo "::error::creating the draft release returned no id"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # 22.04 rather than latest: binaries link against the build host's
          # glibc, so the older base runs on more distributions.
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        # The workspace root: the app, the mod SDK and the bundled mods.
        run: pnpm install --frozen-lockfile

      # aurad and aura ship inside the app as Tauri sidecars and must exist
      # before the bundler runs.
      - name: Build daemon, CLI and bundled mods
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: ./scripts/build-sidecars.sh release

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the updater artifacts (.app.tar.gz, setup.exe, .msi, .AppImage,
          # .deb, .rpm); the build fails without the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create-release.outputs.release-id }}
          # latest.json is assembled once by the publish job: these jobs run in
          # parallel, and each would read, rewrite and re-upload it, dropping
          # the platforms another job just added.
          includeUpdaterJson: false

  android:
    needs: create-release
    name: Android
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The app compiles against platform 37 (compileSdk in app/build.gradle.kts).
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4

      # Signed with the keystore in the secrets (the names app/build.gradle.kts
      # reads). Without them the APK is signed with the debug key.
      - name: Build the release APK
        working-directory: apps/android
        env:
          AURA_ANDROID_KEYSTORE: ${{ secrets.AURA_ANDROID_KEYSTORE }}
          AURA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AURA_ANDROID_KEYSTORE_PASSWORD }}
          AURA_ANDROID_KEY_ALIAS: ${{ secrets.AURA_ANDROID_KEY_ALIAS }}
          AURA_ANDROID_KEY_PASSWORD: ${{ secrets.AURA_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$AURA_ANDROID_KEYSTORE" ]; then
            echo "::warning::no AURA_ANDROID_KEYSTORE secret: the APK is signed with the debug key"
          fi
          ./gradlew assembleRelease

      - name: Upload the APK to the release
        run: |
          apk="Aura-${GITHUB_REF_NAME#v}-android.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$apk"
          # A re-run replaces the one it uploaded before.
          for asset in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq ".[] | select(.name == \"$apk\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
          done
          gh api -X POST -H "Content-Type: application/vnd.android.package-archive" --input "$apk" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$apk" \
            --jq '"uploaded " + .name'

  publish-release:
    needs: [create-release, build, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One manifest for every platform, from the signatures the builds
      # uploaded. Fails when an artifact is unsigned or a platform is missing,
      # so a release never reaches installed copies half-updatable.
      - name: Assemble the updater manifest
        run: node scripts/updater-manifest.mjs --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --out latest.json

      - name: Upload the updater manifest
        run: |
          # A re-run replaces the one it uploaded before.
          for asset in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq '.[] | select(.name == "latest.json") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
          done
          gh api -X POST -H "Content-Type: application/json" --input latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" \
            --jq '"uploaded " + .name'

      - name: Publish release
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false
